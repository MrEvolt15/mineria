# Configuración para producción/exposición pública
spring.application.name=mineria
server.port=8080

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=mineria_db

# Security - Permitir solo ciertos endpoints
management.endpoints.web.exposure.include=health

# Logging para producción
logging.level.com.mineria.back.mineria=INFO
logging.level.org.springframework.data.mongodb=WARN

# JSON serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

# Server settings para acceso remoto
server.address=0.0.0.0
