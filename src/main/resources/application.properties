spring.application.name=mineria

# MongoDB Configuration (configuración estándar)
# spring.data.mongodb.host=localhost
# spring.data.mongodb.port=27017
# spring.data.mongodb.database=mineria_db

# MongoDB Configuration optimizada para alto tráfico (ACTIVA)
spring.data.mongodb.uri=mongodb://localhost:27017/mineria_db?maxPoolSize=100&minPoolSize=10&maxIdleTimeMS=30000&connectTimeoutMS=10000&socketTimeoutMS=5000&serverSelectionTimeoutMS=5000

# Server Configuration
server.address=0.0.0.0
server.port=8080
server.servlet.context-path=/

# Logging Configuration
logging.level.com.mineria.back.mineria=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# JSON serialization settings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true

# Thread Pool Configuration para alto tráfico
spring.task.execution.pool.core-size=20
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=1000
spring.task.execution.thread-name-prefix=mineria-exec-

# Tomcat Connector Configuration para alto tráfico
server.tomcat.threads.max=300
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=8192
