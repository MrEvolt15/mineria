spring.application.name=mineria

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=mineria_db

# Alternative MongoDB URI (uncomment if you prefer this format)
# spring.data.mongodb.uri=mongodb://localhost:27017/mineria_db

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Logging Configuration
logging.level.com.mineria.back.mineria=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# JSON serialization settings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=true
